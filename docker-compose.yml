services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
      POSTGRES_DB: hireflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., args: { APP: api } }
    environment: &backend-env
      DATABASE_URL: postgres://hireflow:hireflow@postgres:5432/hireflow
      REDIS_HOST: redis
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random string of 32+ characters}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      # Browsers reach the API only through the web container's nginx, which
      # sets X-Forwarded-For; trust exactly that one hop.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # Published on localhost only, so nobody can bypass nginx and spoof
    # X-Forwarded-For from another machine. Use :8080 from browsers.
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., args: { APP: worker } }
    environment: *backend-env
    depends_on:
      api: { condition: service_started } # api runs migrations first
    deploy:
      replicas: 2 # scale scoring independently of the API

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
