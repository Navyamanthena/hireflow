name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflow
          POSTGRES_DB: hireflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hireflow" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hireflow:hireflow@localhost:5432/hireflow_test
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      # Throwaway secret for CI only; real deployments set their own in .env.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start the full stack
        run: docker compose up -d
      - name: Wait for health through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose ps; docker compose logs --tail 80 api worker; exit 1
      - name: Smoke test auth and scoring through nginx
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/jobs)" = 401
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/register -H 'content-type: application/json' \
            -d '{"orgName":"CI","name":"CI Admin","email":"ci@example.com","password":"ci-password-123"}' | jq -r .token)
          JOB=$(curl -fsS -X POST http://localhost:8080/api/jobs -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"title":"CI role","description":"TypeScript, Node.js, React and PostgreSQL engineer."}' | jq -r .id)
          CAND=$(curl -fsS -X POST http://localhost:8080/api/jobs/$JOB/candidates -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"CI Candidate","resumeText":"TypeScript and Node.js services.\nReact front ends on PostgreSQL."}' | jq -r .id)
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS http://localhost:8080/api/candidates/$CAND -H "authorization: Bearer $TOKEN" | jq -r .scoringStatus)
            if [ "$STATUS" = SCORED ]; then echo "scored through the Docker workers"; exit 0; fi
            sleep 2
          done
          echo "candidate not scored: $STATUS"; docker compose logs --tail 80 worker; exit 1
      - if: always()
        run: docker compose down -v
